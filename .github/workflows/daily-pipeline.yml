name: Daily Stock Pipeline

on:
  schedule:
    # Run at 6 AM UTC on weekdays (1 AM EST, after market close + settlement)
    - cron: '0 6 * * 1-5'
  workflow_dispatch: # Allow manual trigger from GitHub UI

permissions:
  contents: write  # Required to upload to releases and push commits

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 240 # Pipeline takes ~3 hours

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Download databases from release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Check if release exists first
          if gh release view data > /dev/null 2>&1; then
            echo "Downloading databases from 'data' release..."
            gh release download data --pattern "nasdaq_stocks.db" --dir . 2>/dev/null || echo "nasdaq_stocks.db not found in release."
            gh release download data --pattern "backtest.db" --dir . 2>/dev/null || echo "backtest.db not found in release."
            gh release download data --pattern "mock_portfolio.db" --dir . 2>/dev/null || echo "mock_portfolio.db not found in release."
          else
            echo "No 'data' release found. Will create fresh databases."
          fi
          # Create empty databases if they don't exist
          for db in nasdaq_stocks.db backtest.db mock_portfolio.db; do
            if [ ! -f "$db" ]; then
              echo "Creating empty $db..."
              touch "$db"
            fi
          done

      - name: Ensure database schema is up to date
        run: python setup_database.py

      - name: Run pipeline
        env:
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
          PYTHONUNBUFFERED: '1'
        run: python run_pipeline_OPTIMIZED.py

      - name: Backfill recent historical prices
        env:
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
        # Auto-detect mode: fills each symbol's ACTUAL gap (last_date+1 → today), not a
        # fixed 7-day window. A fixed --lookback can't repair multi-week outages, which
        # silently erodes the scored universe (stocks need >=30 prices in 90 days).
        run: python scripts/backfill_recent_prices.py

      - name: Enrich stock data (Forward P/E, PEG, Financial Scores)
        env:
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
        run: python enrich_stock_data.py

      - name: Update hybrid portfolio
        env:
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
        run: |
          if [ -s mock_portfolio.db ]; then
            echo "Updating hybrid portfolio positions..."
            python update_hybrid_portfolio.py
          else
            echo "No hybrid portfolio found (mock_portfolio.db is empty)."
            echo "Run setup_hybrid_portfolio.py locally first to initialize."
          fi

      - name: Refresh analyst accuracy rates (weekly, Mondays only)
        run: |
          DOW=$(date -u +%u)
          if [ "$DOW" = "1" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "Refreshing analyst accuracy rates..."
            python general/research/analyze_analyst_accuracy.py --export
          else
            echo "Skipping — only runs on Mondays (today is day $DOW)"
          fi

      # --- Catalyst signal source data (non-critical; must run BEFORE the export so the
      #     exporter computes catalyst off fresh tables). continue-on-error so a catalyst
      #     collector failure can never block the price/score/export pipeline — the catalyst
      #     fields just degrade to null. ---
      - name: Refresh analyst grades for catalyst signal
        continue-on-error: true
        env:
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
        run: |
          python collectors/collect_analyst_data.py --grades-only \
            || echo "WARNING: grades refresh failed; catalyst upgrade fields degrade to null"

      - name: Refresh earnings surprises for catalyst signal
        continue-on-error: true
        env:
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
        run: |
          FROM=$(python3 -c "from datetime import date,timedelta;print((date.today()-timedelta(days=14)).isoformat())")
          TO=$(python3 -c "from datetime import date;print(date.today().isoformat())")
          python collectors/collect_earnings_surprises.py --from "$FROM" --to "$TO" \
            || echo "WARNING: earnings refresh failed; catalyst EPS fields degrade to null"

      # Append one dated layer of analyst consensus to estimate_ledger so an estimate-REVISION
      # series accrues over time (FMP serves no point-in-time revision history to backfill).
      # Groundwork for a future revision variable; not consumed by today's export.
      - name: Snapshot analyst estimates (revision ledger)
        continue-on-error: true
        env:
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
        run: |
          python collectors/snapshot_estimates.py \
            || echo "WARNING: estimate-ledger snapshot failed (non-critical, groundwork only)"

      - name: Export website stocks.json
        env:
          STOCKS_JSON_OUTPUT: data/stocks.json
        run: python export_website_stocks.py

      - name: Export 5yr daily price history to KV bulk files
        env:
          STOCKS_JSON_OUTPUT: data/stocks.json
        run: python scripts/export_prices_kv.py --out-dir /tmp

      - name: Export valuation-multiple overlays to KV bulk files
        env:
          STOCKS_JSON_OUTPUT: data/stocks.json
        run: python scripts/export_overlays_kv.py --out-dir /tmp

      - name: Export movers data to parquet
        run: python export_movers_data.py

      - name: Upload updated databases to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Uploading databases to release 'data'..."
          # Check if release exists
          if gh release view data > /dev/null 2>&1; then
            echo "Release 'data' exists, uploading with --clobber..."
            # Upload nasdaq_stocks.db
            gh release upload data nasdaq_stocks.db --clobber || {
              gh release delete-asset data nasdaq_stocks.db --yes 2>/dev/null || true
              gh release upload data nasdaq_stocks.db
            }
            # Upload backtest.db only if it has fundamental data (protects against clobbering)
            FUND_COUNT=$(sqlite3 backtest.db "SELECT COUNT(*) FROM historical_income_statements" 2>/dev/null || echo "0")
            echo "backtest.db has $FUND_COUNT fundamental records"
            if [ "$FUND_COUNT" -gt 1000 ]; then
              gh release upload data backtest.db --clobber || {
                gh release delete-asset data backtest.db --yes 2>/dev/null || true
                gh release upload data backtest.db
              }
            else
              echo "WARNING: Skipping backtest.db upload — too few fundamental records ($FUND_COUNT). Protecting release data."
            fi
            # Upload mock_portfolio.db if it has data
            if [ -s mock_portfolio.db ]; then
              gh release upload data mock_portfolio.db --clobber || {
                gh release delete-asset data mock_portfolio.db --yes 2>/dev/null || true
                gh release upload data mock_portfolio.db
              }
            fi
          else
            echo "Release 'data' does not exist, creating it..."
            gh release create data nasdaq_stocks.db --title "Pipeline Data" --notes "Auto-updated stock database"
          fi
      - name: Commit updated parquet data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git stash --include-untracked || true
          git pull --rebase origin main || true
          git stash pop || true
          git add data/dashboard_data.parquet data/movers_data.parquet data/stocks.json
          git diff --staged --quiet || git commit -m "Update dashboard data $(date +%Y-%m-%d)"
          for i in 1 2 3; do git push && break || echo "Push attempt $i failed, retrying..." && sleep 15; done

      - name: Push stock data to compass-score-site
        env:
          GH_TOKEN: ${{ secrets.SITE_DEPLOY_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "SITE_DEPLOY_TOKEN not set, skipping push to compass-score-site"
            exit 0
          fi
          git clone https://x-access-token:${GH_TOKEN}@github.com/pcheever2-cmd/stockbrowse-app.git compass-site
          cp data/stocks.json compass-site/src/data/stocks.json
          cp data/stocks-public.json compass-site/src/data/stocks-public.json
          cp data/stocks-premium.json compass-site/src/data/stocks-premium.json
          cd compass-site
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/data/stocks.json src/data/stocks-public.json src/data/stocks-premium.json
          git diff --staged --quiet || git commit -m "Update stock data $(date +%Y-%m-%d)"
          for i in 1 2 3; do git push && break || echo "Push attempt $i failed, retrying..." && sleep 10; done

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build and deploy to Cloudflare Pages
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PUBLIC_SUPABASE_URL: https://jyadpvwxedqvqlrsghzy.supabase.co
          PUBLIC_SUPABASE_ANON_KEY: sb_publishable_mWnsNqWDuUYfbdDJrr5u6w_bzFwgQDk
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "CLOUDFLARE_API_TOKEN not set, skipping Pages deploy"
            exit 0
          fi
          if [ ! -d "compass-site" ]; then
            echo "compass-site directory not found, skipping Pages deploy"
            exit 0
          fi
          cd compass-site
          npm ci
          npm run build
          npm install -g wrangler@4
          wrangler pages deploy dist --project-name=stockbrowse-app-pages --commit-dirty=true

      - name: Sync premium data to Cloudflare KV
        if: success()
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "CLOUDFLARE_API_TOKEN not set, skipping KV sync"
            exit 0
          fi
          npm install -g wrangler@4
          python3 -c "
          import json
          with open('data/stocks-premium.json') as f:
              data = json.load(f)
          pairs = [{'key': f'stock:{sym}', 'value': json.dumps(val)} for sym, val in data.items()]
          with open('/tmp/kv_bulk.json', 'w') as f:
              json.dump(pairs, f)
          print(f'Prepared {len(pairs)} KV entries')
          "
          wrangler kv bulk put /tmp/kv_bulk.json --namespace-id a16202c79b5b4372b3a686d6a4f8baf1 --remote
          rm /tmp/kv_bulk.json
          echo "KV sync complete"

      - name: Sync price history to Cloudflare KV
        if: success()
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "CLOUDFLARE_API_TOKEN not set, skipping price-history KV sync"
            exit 0
          fi
          npm install -g wrangler@4
          shopt -s nullglob
          files=(/tmp/prices_kv_*.json)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No price-history bulk files found, skipping"
            exit 0
          fi
          for f in "${files[@]}"; do
            echo "Uploading $f"
            wrangler kv bulk put "$f" --namespace-id a16202c79b5b4372b3a686d6a4f8baf1 --remote
            rm "$f"
          done
          echo "Price-history KV sync complete"

      - name: Sync valuation overlays to Cloudflare KV
        if: success()
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "CLOUDFLARE_API_TOKEN not set, skipping overlays KV sync"
            exit 0
          fi
          npm install -g wrangler@4
          shopt -s nullglob
          files=(/tmp/overlays_kv_*.json)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No overlays bulk files found, skipping"
            exit 0
          fi
          for f in "${files[@]}"; do
            echo "Uploading $f"
            wrangler kv bulk put "$f" --namespace-id a16202c79b5b4372b3a686d6a4f8baf1 --remote
            rm "$f"
          done
          echo "Overlays KV sync complete"
