name: Compass Score Update

on:
  schedule:
    # Run at 7 AM UTC on Mon/Wed/Fri (2 AM EST, after daily pipeline)
    - cron: '0 7 * * 1,3,5'
  workflow_dispatch: # Allow manual trigger

permissions:
  contents: write

# Shared with daily-pipeline.yml — see the note there. The 07:00 cron here can
# overlap daily's 06:00 run (up to 4h); without this group the two clobber each
# other's nasdaq_stocks.db release upload.
concurrency:
  group: release-db
  cancel-in-progress: false

jobs:
  compute-scores:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install pandas numpy aiohttp

      - name: Download databases from release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Downloading databases from 'data' release..."
          gh release download data --pattern "backtest.db" --dir . || echo "backtest.db not found"
          gh release download data --pattern "nasdaq_stocks.db" --dir . || echo "nasdaq_stocks.db not found"

      - name: Ensure database schema is up to date
        run: python setup_database.py

      - name: Backfill recent historical prices
        env:
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
        # Auto-detect mode: fills each symbol's actual gap, not a fixed 7-day window
        # (a fixed lookback can't repair multi-week outages → eroded scored universe).
        run: python scripts/backfill_recent_prices.py

      - name: Compute Compass Scores
        run: python compute_compass_scores.py

      - name: Compute Valuation Scores
        run: python compute_valuation_scores.py

      - name: Export website stocks.json
        env:
          STOCKS_JSON_OUTPUT: data/stocks.json
        run: python export_website_stocks.py

      - name: Upload updated nasdaq_stocks.db to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Uploading updated nasdaq_stocks.db..."
          gh release upload data nasdaq_stocks.db --clobber

      - name: Push stock data to compass-score-site
        env:
          GH_TOKEN: ${{ secrets.SITE_DEPLOY_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "SITE_DEPLOY_TOKEN not set, skipping push to compass-score-site"
            exit 0
          fi
          git clone https://x-access-token:${GH_TOKEN}@github.com/pcheever2-cmd/stockbrowse-app.git compass-site
          cp data/stocks.json compass-site/src/data/stocks.json
          cp data/stocks-public.json compass-site/src/data/stocks-public.json
          cp data/stocks-premium.json compass-site/src/data/stocks-premium.json
          cd compass-site
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/data/stocks.json src/data/stocks-public.json src/data/stocks-premium.json
          git diff --staged --quiet || git commit -m "Update stock data $(date +%Y-%m-%d)"
          git push

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build and deploy to Cloudflare Pages
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PUBLIC_SUPABASE_URL: https://jyadpvwxedqvqlrsghzy.supabase.co
          PUBLIC_SUPABASE_ANON_KEY: sb_publishable_mWnsNqWDuUYfbdDJrr5u6w_bzFwgQDk
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "CLOUDFLARE_API_TOKEN not set, skipping Pages deploy"
            exit 0
          fi
          if [ ! -d "compass-site" ]; then
            echo "compass-site directory not found, skipping Pages deploy"
            exit 0
          fi
          cd compass-site
          npm ci
          npm run build
          npm install -g wrangler@4
          wrangler pages deploy dist --project-name=stockbrowse-app-pages --commit-dirty=true

      - name: Sync premium data to Cloudflare KV
        if: success()
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "CLOUDFLARE_API_TOKEN not set, skipping KV sync"
            exit 0
          fi
          npm install -g wrangler@4
          python3 -c "
          import json
          with open('data/stocks-premium.json') as f:
              data = json.load(f)
          pairs = [{'key': f'stock:{sym}', 'value': json.dumps(val)} for sym, val in data.items()]
          with open('/tmp/kv_bulk.json', 'w') as f:
              json.dump(pairs, f)
          print(f'Prepared {len(pairs)} KV entries')
          "
          wrangler kv bulk put /tmp/kv_bulk.json --namespace-id a16202c79b5b4372b3a686d6a4f8baf1 --remote
          rm /tmp/kv_bulk.json
          echo "KV sync complete"
